<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" role="img" aria-labelledby="title desc">
  <title id="title">Pie Fixe logo</title>
  <desc id="desc">Orange circle with a P beside the Pie Fixe wordmark.</desc>
