  <circle cx="90" cy="90" r="62" fill="#f2673a"/>
  <text x="90" y="113" text-anchor="middle" fill="#171717" font-family="Arial, sans-serif" font-size="76" font-weight="800">P</text>
  <text x="180" y="112" fill="#171717" font-family="Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="-5">PIE FIXE</text>
</svg>
